name: Refresh prices and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  # Cloudflare Pages 项目名，可在仓库 Settings → Variables 里用 CF_PAGES_PROJECT 覆盖
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'chatgpt-business-price-radar' }}

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        name: Run pushes and manual dispatches immediately; schedules every two days
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          epoch_day=$(( $(date -u +%s) / 86400 ))
          if (( epoch_day % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Locate the previous deployed snapshot
        run: echo "PREVIOUS_SNAPSHOT_URL=https://${CF_PAGES_PROJECT}.pages.dev/data/prices.json" >> "$GITHUB_ENV"

      - name: Probe the OpenAI pricing endpoint
        run: npm run probe

      - name: Collect and validate official monthly prices
        env:
          MIN_FIRST_RUN_ROWS: 20
          PRICING_CONCURRENCY: 4
        run: npm run collect

      - name: Type-check and build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 首次运行时自动创建 Pages 项目；已存在时忽略报错
          preCommands: npx wrangler pages project create "$CF_PAGES_PROJECT" --production-branch=main || true
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main
